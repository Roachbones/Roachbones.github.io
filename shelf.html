<style>

bodyV {
    background:
    radial-gradient(circle at 0% 50%, rgba(96, 16, 48, 0) 9px, #613 10px, rgba(96, 16, 48, 0) 11px) 0px 10px,
    radial-gradient(at 100% 100%,      rgba(96, 16, 48, 0) 9px, #613 10px, rgba(96, 16, 48, 0) 11px),
    #8a3;
    background-size: 20px 20px;
}

u {
    border-bottom: 1px solid burlywood;
    background-color: burlywood;
}

input {
    display: inline-block;
    --rand1a: mod(sin(sibling-index()) * 9e4, 1);
    --rand1b: mod(sin(sibling-index() + e) * 9e4, 1);
    --rand1c: mod(sin(sibling-index() + 2 * e) * 9e4, 1);
    --rand1d: mod(sin(sibling-index() + 3 * e) * 9e4, 1);
    background-color: var(--c);
    border: 1px solid contrast-color(var(--c));
    --c: hsl(calc(var(--rand1a) * 1turn), 80%, 80%);
    --width: calc(2ch + 4ch * var(--rand1a));
    width: var(--width);
    --height: calc(10ch + 10ch * (var(--rand1b) + var(--rand1a)));
    height: var(--height);
    margin: 0; Vmargin-right: calc(2px * var(--rand1d));
    padding: .1em;
    appearance: none;
    box-sizing: border-box;
    
    &::details-content {
        display: block;
        position: fixed;
        bottom: 0px;
        left: 0px;
        width: 20ch;
        height: 10ch;
        border: 1px inset black;
        background-color: var(--c);
    }
    &:checked {
        border-width: 2px;
    }
}
</style>
